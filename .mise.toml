min_version = "2024.9.5"

[env]
# Go to ref of this `ExamFactory.from_storage` still not working
# PYTHONPATH = "{{config_root}}/libs/examcore/src:{{config_root}}/backend/src:{{config_root}}/ml/src"
_.python.venv = { path = ".venv", create = true }

[tools]
python = "3.10"
uvicorn = "0.7"
node = "22"

[tasks.start_back]
alias = "sb"
run = "uvicorn server:app --host 127.0.0.1 --port 8000"

[tasks.start_inspector]
alias = "si"
run = "DANGEROUSLY_OMIT_AUTH=true npx @modelcontextprotocol/inspector"
